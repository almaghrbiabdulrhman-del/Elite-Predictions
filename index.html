<script>
(function retryBridge(){
  var attempts = 0;
  function tryBind(){
    attempts++;
    var hasLogin = typeof window.doLogin === 'function';
    var hasRegister = typeof window.doRegister === 'function';
    var hasAdmin = typeof window.doAdminLogin === 'function';
    if(!hasLogin || !hasRegister || !hasAdmin){
      if(attempts < 200){ setTimeout(tryBind, 100); }
      return;
    }
    var loginBtn = document.getElementById('loginBtn');
    var regBtn = document.getElementById('registerBtn');
    var adminBtn = document.getElementById('adminLoginBtn');
    var goReg = document.getElementById('goToRegister');
    var goLogin = document.getElementById('goToLogin');
    var goAdmin = document.getElementById('goToAdmin');
    var goPlayer = document.getElementById('goToPlayer');
    if(loginBtn){ loginBtn.onclick=null; loginBtn.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); window.doLogin(); },true); }
    if(regBtn){ regBtn.onclick=null; regBtn.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); window.doRegister(); },true); }
    /* adminLoginBtn: bound in initEvents only.
       WARNING: admin authorization MUST be enforced server-side (RLS policy or
       Postgres SECURITY DEFINER function keyed off auth.uid()), never by a
       client-side flag/password compared in JS. A client-only admin check is bypassable. */
    if(goReg) goReg.onclick=function(){ document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display=''; document.getElementById('adminSection').style.display='none'; };
    if(goLogin) goLogin.onclick=function(){ document.getElementById('loginForm').style.display=''; document.getElementById('registerForm').style.display='none'; document.getElementById('adminSection').style.display='none'; };
    if(goAdmin) goAdmin.onclick=function(){ document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='none'; document.getElementById('adminSection').style.display=''; };
    if(goPlayer) goPlayer.onclick=function(){ document.getElementById('loginForm').style.display=''; document.getElementById('registerForm').style.display='none'; document.getElementById('adminSection').style.display='none'; };
    ['loginUsername','loginPassword'].forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('keydown',function(e){ if(e.key==='Enter') window.doLogin(); }); });
    /* adminPassword keydown: يُسجَّل في initEvents فقط */
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded',tryBind); } else { tryBind(); }
})();
</script>
